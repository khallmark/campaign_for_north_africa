name: Deploy Pages

# Deliberate releases only: a push must never publish unvalidated map work.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full validated commit SHA at the selected ref
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CNA_PRIVATE_REVIEW_TILES: ''
      CNA_PUBLIC_BASE: /campaign_for_north_africa/
    steps:
      - name: Require the validated source commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$GITHUB_SHA" = "$EXPECTED_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/CNAv2.1.0/images/
            !*.pdf
            !*.sqlite*
      - name: Fetch indexed blobs for offline credential scanning
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\n')"
          git fetch --refetch --no-filter --depth=1 --no-tags origin "$GITHUB_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned Rust and Wasm bindings
        run: |
          rustup show
          cargo install wasm-bindgen-cli --version 0.2.105 --locked
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run check:guards
      - run: node --test tests/pages-bundle.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Build and exercise the production project path
        run: npx playwright test tests/browser/pages.spec.ts --project=chromium-1280x800-dpr1
      - name: Record and inspect the exact release bundle
        run: |
          printf '{"sha":"%s"}\n' "$GITHUB_SHA" > dist/deployment.json
          python3 scripts/check-pages-bundle.py dist
          cargo run --locked -p cna-map --bin map-census -- --release-check
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the inspected artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

name: Validate

on:
  pull_request:
    branches: [main, feat/cna-private-integration]
  push:
    branches: [main, feat/cna-private-integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Default checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CNA_PRIVATE_REVIEW_TILES: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/CNAv2.1.0/images/
            !*.pdf
      - name: Fetch indexed blobs for offline credential scanning
        shell: bash
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          # Sparse checkout implicitly uses blob:none. Fetch objects, not files,
          # before scanning; credentials exist only in this command's environment.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\n')"
          git fetch --refetch --no-filter --depth=1 --no-tags origin "$(git rev-parse HEAD)"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, Node 24
        with:
          python-version: '3.11'
      - name: Install pinned Rust toolchain and Wasm bindings
        run: |
          rustup show
          cargo install wasm-bindgen-cli --version 0.2.105 --locked
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Assert original artwork is absent
        shell: bash
        run: |
          test ! -e docs/CNAv2.1.0/images
          test -z "$(find docs -name '*.pdf' -print -quit)"
      - run: npm run check:ci
      # No source tree, dist, traces or screenshots are uploaded. Browser
      # fixtures are synthetic; inspect local ignored output when debugging.

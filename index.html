<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="%BASE_URL%" />
    <meta name="theme-color" content="#3f4c3d" />
    <meta
      name="description"
      content="Explore the Campaign for North Africa board, source catalog and campaign calendar in Field Command."
    />
    <title>The Campaign for North Africa — Field Command</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html, body { margin: 0; background: #e8e4d6; color: #303a31; }
      .startup { position: fixed; inset: 0; display: grid; place-items: center; font-family: system-ui, sans-serif; }
      .startup-overview { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .startup-status { position: relative; margin: 24px; padding: 20px 28px; background: #fbfaf5; border: 1px solid #c8cebb; text-align: center; }
      .startup-status strong { display: block; margin-bottom: 8px; font: 24px Georgia, serif; }
      .startup-status p { margin: 0; font-size: 14px; }
    </style>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" media="print" onload="this.media='all'" />
  </head>
  <body>
    <div id="app">
      <div class="startup">
        <div class="startup-status" role="status">
          <strong>Field Command</strong>
          <p>Loading the map workspace…</p>
        </div>
      </div>
    </div>
    <noscript>Field Command requires JavaScript and WebAssembly to load the Rust application.</noscript>
    <script type="module" src="/wasm/boot.js"></script>
  </body>
</html>
